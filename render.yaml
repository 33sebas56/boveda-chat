services:
  - type: web
    name: boveda-chat
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: BOVEDA_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: boveda-chat
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMS_ENABLED
        value: "false"
      - key: SMS_DAILY_BUDGET
        value: "20"
# En el panel de Render agrega el Secret File supabase-ca.crt antes del despliegue.
# Las variables Twilio solo se agregan cuando decidas activar SMS_ENABLED.
