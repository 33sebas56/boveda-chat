<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#163f35"><meta name="description" content="Conversaciones privadas y documentos en un mismo lugar.">
    <meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Auditoría · Bóveda Chat</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/app.css"></head>
<body class="workspace-body"><header class="topbar"><a class="brand" href="/app" aria-label="Bóveda Chat, inicio"><svg aria-hidden="true"><use href="/icons.svg#vault"></use></svg><span>Bóveda<span class="brand-light"> Chat</span></span></a><a href="/app" class="button secondary">Volver a mi espacio</a></header><main class="audit-page"><div class="page-heading"><div><span class="eyebrow">ADMINISTRACIÓN</span><h1>Registro de actividad</h1><p class="muted">Últimos 200 eventos. El registro no contiene mensajes, contraseñas ni códigos SMS.</p></div><a class="button secondary" href="/admin/auditoria">Actualizar</a></div><div class="table-card"><table><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead><tbody><tr th:each="event : ${events}"><td th:text="${#temporals.format(event.createdAt, 'dd/MM/yyyy HH:mm', 'America/Bogota')}"></td><td th:text="${event.actor}"></td><td><span class="event-tag" th:text="${event.action}"></span></td><td th:text="${event.detail}"></td></tr><tr th:if="${#lists.isEmpty(events)}"><td colspan="4">Todavía no hay eventos.</td></tr></tbody></table></div></main></body></html>
