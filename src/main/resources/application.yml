spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: boveda-chat
  profiles:
    default: local
  datasource:
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 15000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: boveda_chat
        jdbc.time_zone: UTC
  flyway:
    schemas: boveda_chat
    default-schema: boveda_chat
    create-schemas: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  tomcat:
    threads:
      max: 6
      min-spare: 2
    max-http-form-post-size: 6MB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  crypto:
    key: ${BOVEDA_KEY:}
    key-file: .local/clave.key
    require-key: false
  storage:
    mode: local
    directory: .local/archivos
    url: ${SUPABASE_URL:}
    secret: ${SUPABASE_SECRET_KEY:}
    bucket: ${SUPABASE_BUCKET:boveda-chat}
  sms:
    enabled: ${SMS_ENABLED:false}
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
    daily-budget: ${SMS_DAILY_BUDGET:20}
  bootstrap:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  limits:
    file-bytes: 5242880
    account-bytes: 52428800
    account-files: 100
logging:
  level:
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.security: WARN
